<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地视频库 v3</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel-2:#1d222b; --line:#262d38;
    --txt:#e6e9ee; --sub:#8b95a5; --accent:#4ea1ff; --accent-2:#2f7ce0;
    --hover:#212734; --sel:#1b2a44; --radius:12px;
    --ok:#37d67a; --err:#ff6b6b; --warn:#f0b429;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* 顶栏 */
  header{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  header .brand{font-weight:700;font-size:15px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;}
  header .brand .dot{width:9px;height:9px;border-radius:50%;background:#37d67a;box-shadow:0 0 10px #37d67a88;}
  .addr{display:flex;align-items:center;gap:8px;margin-left:auto;flex:1;min-width:260px;max-width:560px;}
  .addr label{font-size:12px;color:var(--sub);white-space:nowrap;}
  .addr input{
    flex:1;min-width:0;background:var(--panel-2);color:var(--txt);
    border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;
    outline:none;transition:.15s;
  }
  .addr input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4ea1ff22;}
  .addr .st{font-size:12px;color:var(--sub);white-space:nowrap;min-width:52px;}
  .addr .st.ok{color:var(--ok);}
  .addr .st.err{color:var(--err);}
  button.ghost{
    background:var(--panel-2);color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;transition:.15s;
  }
  button.ghost:hover{border-color:var(--accent);color:var(--accent);}
  button.ghost:disabled{opacity:.5;cursor:not-allowed;}

  /* 任务按钮 & 徽标 */
  #taskBtn{position:relative;}
  #taskBadge{
    position:absolute;top:-6px;right:-8px;min-width:18px;height:18px;
    border-radius:9px;background:var(--accent);color:#fff;font-size:11px;
    display:flex;align-items:center;justify-content:center;padding:0 5px;
    font-weight:600;
  }

  /* 主体 */
  main{display:flex;flex:1 1 auto;overflow:hidden;}

  /* 侧边栏 */
  aside{
    width:300px;flex:0 0 300px;background:var(--panel);
    border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;
  }
  .sb-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);}
  .sb-head .t{font-size:13px;font-weight:600;}
  .sb-head .cnt{font-size:12px;color:var(--sub);}
  .sb-tools{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;}
  .sb-tools input{flex:1;min-width:0;background:var(--panel-2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;outline:none;}
  .sb-tools input:focus{border-color:var(--accent);}
  .list{flex:1 1 auto;overflow-y:auto;padding:8px 8px 16px;}
  .list::-webkit-scrollbar{width:8px;} .list::-webkit-scrollbar-thumb{background:#333b4a;border-radius:4px;}

  .item{
    display:flex;gap:11px;align-items:flex-start;padding:9px 10px;border-radius:10px;
    cursor:pointer;transition:.13s;border:1px solid transparent;
  }
  .item:hover{background:var(--hover);}
  .item.sel{background:var(--sel);border-color:#2f5fa8;}
  .thumb{
    width:88px;height:50px;flex:0 0 88px;border-radius:7px;background:#0b0e13;
    overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .ph{font-size:20px;opacity:.35;}
  .thumb .badge{
    position:absolute;right:4px;bottom:4px;font-size:9px;background:#000000aa;
    color:#fff;padding:1px 4px;border-radius:4px;letter-spacing:.2px;
  }
  .meta{flex:1 1 auto;min-width:0;padding-top:1px;}
  .meta .name{font-size:13px;line-height:1.35;font-weight:500;word-break:break-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .meta .path{font-size:11px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .empty,.errbox{color:var(--sub);font-size:13px;text-align:center;padding:38px 18px;line-height:1.7;}
  .empty .ic{font-size:30px;opacity:.3;margin-bottom:10px;}
  .errbox b{color:#ff8f8f;display:block;margin-bottom:6px;font-weight:600;}
  .errbox code{font-size:11px;color:var(--sub);word-break:break-all;background:#0b0e13;padding:5px 8px;border-radius:6px;display:block;margin-top:8px;text-align:left;}

  /* 播放区 */
  .stage{flex:1 1 auto;display:flex;flex-direction:column;overflow:hidden;background:#0a0c10;}
  .player-wrap{
    flex:1 1 auto;min-height:0;max-height:calc(100vh - 70px);
    display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;position:relative;
  }
  .player-wrap video{
    width:100%;max-width:1180px;max-height:calc(100vh - 110px);
    object-fit:contain;background:#000;
  }
  .idle{color:var(--sub);text-align:center;line-height:1.8;}
  .idle .ic{font-size:46px;opacity:.25;margin-bottom:14px;}
  .idle b{color:var(--txt);font-weight:600;font-size:15px;display:block;margin-bottom:4px;}
  .infobar{padding:12px 20px;border-top:1px solid var(--line);background:var(--panel);flex:0 0 auto;}
  .infobar .cur{font-size:14px;font-weight:600;word-break:break-all;}
  .infobar .cur small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:3px;}

  /* ===== 任务弹窗 ===== */
  .modal-mask{
    position:fixed;inset:0;background:#00000088;z-index:100;
    display:none;align-items:flex-start;justify-content:center;padding-top:80px;
  }
  .modal-mask.show{display:flex;}
  .modal{
    width:560px;max-width:calc(100vw - 32px);background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 20px 60px #000000aa;overflow:hidden;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--line);
  }
  .modal-head .t{font-size:14px;font-weight:600;}
  .modal-body{padding:16px;max-height:60vh;overflow-y:auto;}
  .modal-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;}

  .form-row{margin-bottom:12px;}
  .form-row label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
  .form-row input,.form-row textarea{
    width:100%;background:var(--panel-2);color:var(--txt);
    border:1px solid var(--line);border-radius:9px;padding:8px 11px;
    font-size:13px;outline:none;font-family:inherit;
  }
  .form-row textarea{resize:vertical;min-height:80px;}
  .form-row input:focus,.form-row textarea:focus{border-color:var(--accent);}

  .task-item{
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    padding:12px;margin-bottom:10px;
  }
  .task-item.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .task-item .url{font-size:12px;word-break:break-all;flex:1;}
  .task-item .status{
    font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;
  }
  .task-item .status.queued{background:#f0b42922;color:var(--warn);}
  .task-item .status.running{background:#4ea1ff22;color:var(--accent);}
  .task-item .status.succeeded{background:#37d67a22;color:var(--ok);}
  .task-item .status.failed{background:#ff6b6b22;color:var(--err);}

  
  .task-meta{font-size:11px;color:var(--sub);line-height:1.6;}
  .task-log{
    font-size:11px;color:#7fd6ff;background:#0b1b2a;
    border:1px solid #1b3a55;border-radius:7px;
    padding:6px 9px;margin:8px 0 6px;line-height:1.5;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .task-error{font-size:11px;color:var(--err);margin-top:6px;word-break:break-all;}

  @media (max-width:760px){
    aside{width:240px;flex-basis:240px;}
    .thumb{width:70px;height:40px;flex-basis:70px;}
    .modal{width:calc(100vw - 24px);}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot" id="liveDot"></span>本地视频库</div>
  <div class="addr">
    <label>服务地址</label>
    <input id="hostInput" type="text" spellcheck="false" placeholder="127.0.0.1:8080">
  </div>
  <div class="addr">
    <label>目录 path</label>
    <input id="pathInput" type="text" spellcheck="false" placeholder="/mnt/loli（留空=根）">
    <span class="st" id="hostState">未检测</span>
    <button class="ghost" id="reloadBtn">刷新列表</button>
    <button class="ghost" id="taskBtn">⬇ 下载 m3u8 <span id="taskBadge" style="display:none">0</span></button>
  </div>
</header>

<main>
  <aside>
    <div class="sb-head">
      <span class="t">文件列表</span>
      <span class="cnt" id="cnt">0 个</span>
    </div>
    <div class="sb-tools">
      <input id="filter" type="search" placeholder="筛选文件名…">
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div class="stage">
    <div class="player-wrap" id="playerWrap">
      <div class="idle" id="idle">
        <div class="ic">▶</div>
        <b>还没选视频</b>
        从左侧点一个文件，自动开始播放<br>
        缩略图取 <code>/video/thumbnail?path=…</code>
      </div>
      <video id="video" controls preload="metadata" playsinline style="display:none"></video>
    </div>
    <div class="infobar" id="infobar" style="display:none">
      <div class="cur" id="curName"></div>
    </div>
  </div>
</main>

<!-- 任务弹窗 -->
<div class="modal-mask" id="taskMask">
  <div class="modal">
    <div class="modal-head">
      <span class="t">m3u8 下载任务</span>
      <button class="ghost" id="closeTaskBtn" style="padding:4px 10px;font-size:12px;">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>m3u8 链接（每行一个）</label>
        <textarea id="m3u8Urls" placeholder="https://example.com/a.m3u8&#10;https://example.com/b.m3u8"></textarea>
      </div>
      <div style="display:flex;gap:10px;">
        <div class="form-row" style="flex:1;">
          <label>代理（可选）</label>
          <input id="proxyInput" type="text" placeholder="http://127.0.0.1:7897">
        </div>
        <div class="form-row" style="flex:1;">
          <label>落盘目录（可选，留空用服务端默认）</label>
          <input id="outputDirInput" type="text" placeholder="/mnt/loli">
        </div>
      </div>
      <button class="ghost" id="submitTaskBtn" style="width:100%;margin-bottom:16px;">提交下载</button>

      <div id="taskList"></div>
    </div>
    <div class="modal-foot">
      <button class="ghost" id="clearDoneBtn" style="font-size:12px;">清理已完成</button>
      <button class="ghost" id="retryAllBtn" style="font-size:12px;">重试失败</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ========== 原有播放器逻辑（精简，保留核心） ========== */
  const LS_HOST = "vlib.host";
  const LS_PATH = "vlib.path";
  const LS_SEL   = "vlib.lastPlay";

  const $ = id => document.getElementById(id);
  const hostInput = $("hostInput"), pathInput = $("pathInput"), state = $("hostState"), list = $("list"),
        video = $("video"), idle = $("idle"), infobar = $("infobar"),
        curName = $("curName"), cnt = $("cnt"), filter = $("filter"),
        reloadBtn = $("reloadBtn"), liveDot = $("liveDot");

  let files = [], current = null;

  function getHost(){ return (hostInput.value || "").replace(/\s+/g,"").replace(/\/+$/,""); }
  function setHost(v){ hostInput.value = v; }
  function saveHost(){ localStorage.setItem(LS_HOST, getHost()); }
  function getPath(){ return (pathInput.value || "").trim(); }
  function setPath(v){ pathInput.value = v == null ? "" : v; }
  function savePath(){ localStorage.setItem(LS_PATH, getPath()); }
  function loadPath(){ const saved = localStorage.getItem(LS_PATH); setPath(saved == null ? "" : saved); }

  function loadHost(){
    const saved = localStorage.getItem(LS_HOST);
    setHost(saved && saved.length ? saved : "http://127.0.0.1:8080");
    if (/^https?:\/\//i.test(getHost())) return;
    setHost("http://" + getHost());
  }
  hostInput.addEventListener("input", () => { saveHost(); markState("check"); });
  hostInput.addEventListener("change", () => {
    let v = getHost();
    if (!/^https?:\/\//i.test(v)) v = "http://" + v;
    setHost(v); saveHost(); loadFiles();
  });
  pathInput.addEventListener("input", savePath);
  pathInput.addEventListener("change", () => { savePath(); loadFiles(); });
  pathInput.addEventListener("keydown", e => { if (e.key === "Enter") { savePath(); loadFiles(); } });

  function markState(s){
    liveDot.style.background = ""; liveDot.style.boxShadow = "";
    if (s === "ok")      { state.textContent = "已连接"; state.className = "st ok"; liveDot.style.background="#37d67a"; liveDot.style.boxShadow="0 0 10px #37d67a88"; }
    else if (s === "err"){ state.textContent = "无法访问"; state.className = "st err"; liveDot.style.background="#ff6b6b"; liveDot.style.boxShadow="0 0 10px #ff6b6baa"; }
    else                 { state.textContent = "检测中…"; state.className = "st"; liveDot.style.background="#f0b429"; liveDot.style.boxShadow="0 0 10px #f0b42988"; }
  }

  function basename(p){ if(!p)return""; const s=String(p).replace(/\\/g,"/"); return s.split("/").filter(Boolean).pop()||p; }
  function escHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function thumbUrl(rawPath){ return getHost() + "/video/thumbnail?path=" + encodeURIComponent(String(rawPath)); }
  function fileUrl(rawPath){ return getHost() + "/video/file?path=" + encodeURIComponent(String(rawPath)); }

  async function loadFiles(){
    markState("check");
    list.innerHTML = '<div class="empty"><div class="ic">↻</div>正在拉取文件列表…</div>';
    const host = getHost(), p = getPath();
    const url = host + "/m3u8/files" + (p ? "?path=" + encodeURIComponent(p) : "");
    let data;
    try{
      const res = await fetch(url, { headers: { "Accept": "application/json" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      data = await res.json();
      markState("ok");
    }catch(e){
      markState("err");
      list.innerHTML = '<div class="errbox"><b>拉不到 /m3u8/files</b><code>' + escHtml(url) + '</code></div>';
      return;
    }
    let arr = [];
    if (Array.isArray(data)) arr = data;
    else if (data && Array.isArray(data.files)) arr = data.files;
    else if (data && Array.isArray(data.list)) arr = data.list;
    else if (data && Array.isArray(data.data)) arr = data.data;
    files = arr.map(normalize).filter(Boolean);
    render();
  }

  function normalize(item){
    if (typeof item === "string") return { path: item, name: basename(item) };
    if (!item) return null;
    const path = item.path || item.file || item.url || item.name || "";
    if (!path) return null;
    return { path, name: item.name ? String(item.name) : basename(path) };
  }

  function render(){
    const kw = filter.value.trim().toLowerCase();
    const shown = kw ? files.filter(f => f.name.toLowerCase().includes(kw) || String(f.path).toLowerCase().includes(kw)) : files;
    cnt.textContent = shown.length + (shown.length === files.length ? " 个" : " / " + files.length + " 个");
    if (!files.length){ list.innerHTML = '<div class="empty"><div class="ic">∅</div>列表是空的</div>'; return; }
    if (!shown.length){ list.innerHTML = '<div class="empty"><div class="ic">🔍</div>没有匹配的文件</div>'; return; }
    const frag = document.createDocumentFragment();
    shown.forEach(f => {
      const el = document.createElement("div");
      el.className = "item" + (current && current.path === f.path ? " sel" : "");
      el.innerHTML =
        '<div class="thumb"><img alt="" loading="lazy" src="' + escHtml(thumbUrl(f.path)) + '" onerror="this.parentNode.innerHTML=\'<div class=&quot;ph&quot;>🎞</div>\';"><span class="badge">MP4</span></div>' +
        '<div class="meta"><div class="name">' + escHtml(f.name) + '</div><div class="path" title="' + escHtml(f.path) + '">' + escHtml(f.path) + '</div></div>';
      el.addEventListener("click", () => play(f));
      frag.appendChild(el);
    });
    list.innerHTML = ""; list.appendChild(frag);
  }
  filter.addEventListener("input", render);

  function play(f){
    current = f; localStorage.setItem(LS_SEL, f.path); render();
    idle.style.display = "none"; video.style.display = "block"; infobar.style.display = "block";
    curName.innerHTML = escHtml(f.name) + '<small>' + escHtml(f.path) + '</small>';
    const src = fileUrl(f.path);
    if (video.src !== src) video.src = src;
    video.play().catch(()=>{});
    const sel = list.querySelector('.item.sel');
    if (sel) sel.scrollIntoView({ block: "nearest" });
  }

  function step(dir){
    if (!files.length) return;
    const i = current ? Math.max(0, files.findIndex(f => f.path === current.path)) : -1;
    const next = files[Math.max(0, Math.min(files.length-1, i + dir))];
    if (next) play(next);
  }
  document.addEventListener("keydown", e => {
    if (e.target === hostInput || e.target === filter) return;
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === " " && current){ e.preventDefault(); video.paused ? video.play() : video.pause(); }
  });

  reloadBtn.addEventListener("click", loadFiles);
  loadHost(); loadPath(); loadFiles().then(() => {
    const last = localStorage.getItem(LS_SEL);
    if (last){ const f = files.find(x => x.path === last) || files.find(x => basename(x.path) === basename(last)); if (f) play(f); }
  });

  /* ========== 任务系统（localStorage 持久化） ========== */
  const LS_TASKS = "vlib.tasks";
  const pollTimers = {};
  const failCount = {};   // 连续失败计数

  const taskBtn = $("taskBtn"), taskBadge = $("taskBadge"),
        taskMask = $("taskMask"), closeTaskBtn = $("closeTaskBtn"),
        m3u8Urls = $("m3u8Urls"), proxyInput = $("proxyInput"),
        outputDirInput = $("outputDirInput"), submitTaskBtn = $("submitTaskBtn"),
        taskList = $("taskList"), clearDoneBtn = $("clearDoneBtn"), retryAllBtn = $("retryAllBtn");

  // 加载保存的代理
  proxyInput.value = localStorage.getItem("vlib.proxy") || "";
  proxyInput.addEventListener("input", () => localStorage.setItem("vlib.proxy", proxyInput.value.trim()));

  /* --- 任务 CRUD --- */
  function loadTasks(){ try{ return JSON.parse(localStorage.getItem(LS_TASKS)||"[]"); }catch(e){ return []; } }
  function saveTasks(tasks){ localStorage.setItem(LS_TASKS, JSON.stringify(tasks.slice(-50))); }
  function upsertTask(task){
    const tasks = loadTasks();
    const idx = tasks.findIndex(t => t.task_id === task.task_id);
    if(idx >= 0) tasks[idx] = Object.assign({}, tasks[idx], task);
    else tasks.push(task);
    saveTasks(tasks);
    updateBadge();
  }
  function getActiveTasks(){
    const terminal = new Set(["succeeded","failed","cancelled","canceled"]);
    return loadTasks().filter(t => t.task_id && !terminal.has((t.status||"").toLowerCase()));
  }
  function updateBadge(){
    const n = getActiveTasks().length;
    taskBadge.textContent = n;
    taskBadge.style.display = n > 0 ? "flex" : "none";
  }

  /* --- 弹窗控制 --- */
  taskBtn.addEventListener("click", () => { taskMask.classList.add("show"); renderTaskList(); });
  closeTaskBtn.addEventListener("click", () => { taskMask.classList.remove("show"); });
  taskMask.addEventListener("click", e => { if(e.target === taskMask) taskMask.classList.remove("show"); });

  /* --- 提交任务 --- */
  submitTaskBtn.addEventListener("click", async () => {
    const urls = m3u8Urls.value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!urls.length){ alert("请填写至少一个 m3u8 链接"); return; }
    const proxy = proxyInput.value.trim();
    const outputDir = outputDirInput.value.trim();
    submitTaskBtn.disabled = true;
    submitTaskBtn.textContent = "提交中…";

    for(const url of urls){
      try{
        const body = {
          operator_name: "m3u8Download",
          config: { init: {}, run: { url, proxy, output_dir: outputDir } }
        };
        const res = await fetch(getHost() + "/tasks", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify(body)
        });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if(data.task_id && data.pipeline_id === data.task_id){
          upsertTask({
            task_id: data.task_id, url, output_dir: outputDir, proxy,
            status:"queued", progress:0, stage:"排队中", message:"", error:"",
            startedAt: Date.now(), finishedAt:null
          });
          startPoll(data.task_id);
        } else throw new Error("返回格式异常");
      }catch(e){
        alert(`提交失败: ${url}\n${e.message}`);
      }
    }
    submitTaskBtn.disabled = false;
    submitTaskBtn.textContent = "提交下载";
    m3u8Urls.value = "";
    renderTaskList();
  });

  /* --- 轮询 --- */
  function startPoll(taskId){
    stopPoll(taskId);
    failCount[taskId] = 0;
    pollTimers[taskId] = setInterval(() => pollOnce(taskId), 10000);
    pollOnce(taskId); // 立即查一次
  }
  function stopPoll(taskId){
    if(pollTimers[taskId]){ clearInterval(pollTimers[taskId]); delete pollTimers[taskId]; }
  }

  async function pollOnce(taskId){
    try{
      const res = await fetch(getHost() + "/tasks?" + new URLSearchParams({task_id:taskId}));
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      failCount[taskId] = 0;

      const status = (data.status||"").toLowerCase();
      const log = parseLog(data.latest_log);
      const t = {
        task_id: taskId,
        status,
        progress: readProgress(data),
        stage: readStage(data),
        message: readMessage(data),
        error: readError(data),
        latest_log: log.raw || "",
        log_frame: log.frame || "",
        log_time:  log.time || "",
        log_speed: log.speed || "",
        log_size:  log.size || "",
        log_fps:   log.fps || "",
        created_at:  data.created_at || undefined,
        started_at:  data.started_at || null,
        finished_at: data.finished_at || null,
        finishedAt: ["succeeded","failed","cancelled","canceled"].includes(status) ? Date.now() : null
      };
      upsertTask(t);
      renderTaskList();

      if(status === "succeeded"){
        stopPoll(taskId);
        loadFiles(); // 刷新文件列表
        // 尝试打开新文件
        const fp = data.result && data.result.file_path;
        if(fp){ const f = files.find(x=>x.path===fp||x.name===basename(fp)); if(f) play(f); }
      } else if(status === "failed"){
        stopPoll(taskId);
      }
    }catch(e){
      failCount[taskId] = (failCount[taskId]||0) + 1;
      if(failCount[taskId] >= 3){ stopPoll(taskId); }
    }
  }

  /* ---------- 适配真实回调 ----------
     { task_id, pipeline_id, status, result, error,
       created_at, started_at, finished_at, latest_log }
     latest_log 示例:
       frame=  607 fps=7.3 q=29.0 size=    4864KiB time=00:00:20.20
       bitrate=1972.6kbits/s speed=0.241x
  ------------------------------------ */
  function parseLog(log){
    const s = log == null ? "" : String(log).replace(/\s+/g," ");
    const n = (re) => { const m = s.match(re); return m ? m[1] : null; };
    return {
      raw: s,
      frame: n(/frame=\s*(\d+)/),
      fps:   n(/fps=\s*([\d.]+)/),
      size:  n(/size=\s*([\d.]+\s*[KMGT]?i?B)/),
      time:  n(/time=\s*([\d:]+)/),          // HH:MM:SS.xx
      bitrate: n(/bitrate=\s*([\d.]+kbits\/s)/),
      speed: n(/speed=\s*([\d.]+)x/)
    };
  }
  // 把 HH:MM:SS.xx 转秒
  function timeToSec(t){
    if(!t) return 0;
    const p = String(t).split(":").map(Number);
    if(p.some(isNaN)) return 0;
    if(p.length===3) return p[0]*3600 + p[1]*60 + p[2];
    if(p.length===2) return p[0]*60 + p[1];
    return p[0];
  }

  function readProgress(d){
    if(!d) return 0;
    // 1) 显式进度字段优先
    if(typeof d.progress === "number") return d.progress > 1 ? d.progress/100 : d.progress;
    if(typeof d.result?.progress === "number") return d.result.progress > 1 ? d.result.progress/100 : d.result.progress;
    if(typeof d.result?.percent === "number") return d.result.percent / 100;
    // 2) 从 latest_log 的 time 推算（需总时长，没有就返回 0 → 进度条自动隐藏）
    const log = parseLog(d.latest_log);
    const sec = timeToSec(log.time);
    const dur = (d.duration || d.result?.duration || 0);
    if(sec > 0 && dur > 0) return Math.min(sec / dur, 1);
    return 0;
  }
  function readStage(d){
    if(!d) return "";
    const st = (d.status||"").toLowerCase();
    if(st === "running")  return "转码/下载中";
    if(st === "queued" || st === "pending") return "排队中";
    if(st === "succeeded") return "已完成";
    if(st === "failed")     return "失败";
    return d.stage || d.result?.stage || "";
  }
  function readMessage(d){
    if(!d) return "";
    return d.message || d.result?.message || d.result?.info || "";
  }
  function readError(d){
    if(!d) return "";
    return d.error || d.result?.error || "";
  }

  /* --- 渲染任务列表 --- */
  /* 日志行：帧 / 时长 / 速度 / 体积，有值才显示；每次轮询重写，所以始终是最新一行 */
  function logLine(t){
    const parts = [];
    if(t.log_frame) parts.push("帧 " + escHtml(t.log_frame));
    if(t.log_time)  parts.push("时码 " + escHtml(t.log_time));
    if(t.log_speed) parts.push("速度 " + escHtml(t.log_speed) + "x");
    if(t.log_fps)   parts.push("fps " + escHtml(t.log_fps));
    if(t.log_size)  parts.push("size " + escHtml(t.log_size));
    return parts.join(" · ");
  }
  function renderTaskList(){
    const tasks = loadTasks().reverse(); // 最新的在前
    if(!tasks.length){ taskList.innerHTML = '<div class="empty"><div class="ic">📭</div>暂无任务</div>'; return; }
    taskList.innerHTML = tasks.map(t => {
      const pct = Math.round((t.progress||0)*100);
      const hasProgress = false;
      const fillClass = t.status==="succeeded"?"done":t.status==="failed"?"err":"";
      const ll = logLine(t);
      return `<div class="task-item">
        <div class="head">
          <div class="url">${escHtml(t.url)}</div>
          <div class="status ${escHtml(t.status)}">${escHtml(t.stage || t.status)}</div>
        </div>
        ${ll ? `<div class="task-log">🖥 ${escHtml(ll)}</div>` : ""}
        ${hasProgress ? `<div class="progress-bar"><div class="progress-fill ${fillClass}" style="width:${pct}%"></div></div>` : ""}
        <div class="task-meta">
          ${hasProgress ? `${pct}%` : (t.status==="succeeded"?"100% · 已完成":t.status==="failed"?"已失败":"")}
          ${t.message ? " · " + escHtml(t.message) : ""}
          ID: ${escHtml(t.task_id)}
          ${t.started_at ? ` · 开始 ${escHtml(fmtTime(t.started_at))}` : ""}
          ${t.finished_at ? ` · 结束 ${escHtml(fmtTime(t.finished_at))}` : ""}
        </div>
        ${t.error ? `<div class="task-error">${escHtml(t.error)}</div>` : ""}
      </div>`;
    }).join("");
  }
  /* 时间戳 → 本地时间，只取 HH:mm:ss */
  function fmtTime(iso){
    if(!iso) return "";
    try{ return new Date(iso).toLocaleTimeString("zh-CN",{hour12:false}); }
    catch(e){ return String(iso); }
  }

  /* --- 清理 / 重试 --- */
  clearDoneBtn.addEventListener("click", () => {
    const tasks = loadTasks().filter(t => !["succeeded","failed","cancelled","canceled"].includes((t.status||"").toLowerCase()));
    saveTasks(tasks); renderTaskList(); updateBadge();
  });
  retryAllBtn.addEventListener("click", () => {
    loadTasks().filter(t=>t.status==="failed").forEach(t=>{ t.status="queued"; upsertTask(t); startPoll(t.task_id); });
    renderTaskList();
  });

  /* --- 页面启动：恢复未完成任务 --- */
  function resumeTasks(){
    getActiveTasks().forEach(t => { if(!pollTimers[t.task_id]) startPoll(t.task_id); });
    updateBadge();
  }
  resumeTasks();

})();
</script>
